name: Manual Build Ubuntu Binary

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Bước cực kỳ quan trọng đối với Linux để PySide6 và OpenCV có thể liên kết thư viện đồ họa
      - name: Install Ubuntu System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libxrender1 \
            libxext6 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller
          pip install --no-deps -r requirements-lite.txt
          
      - name: Build with PyInstaller
        run: |
          # Đóng gói dạng thư mục (--onedir) để chạy ổn định nhất trên Linux
          pyinstaller --noconfirm --onedir --windowed \
          --name "camai" \
          --exclude-module pytest \
          --exclude-module flake8 \
          --exclude-module tests \
          --exclude-module numpy.tests \
          --exclude-module matplotlib \
          --exclude-module scipy \
          --clean \
          --exclude-binary "libxcb*" \
          --exclude-binary "libGL*" \
          --exclude-binary "libEGL*" \
          --exclude-binary "dri" \
          --exclude-binary "nvidia*" \
          mainwindow.py 
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Production-Ubuntu-Binary
          # Thư mục chứa ứng dụng sau khi build trên Linux
          path: dist/camai/
